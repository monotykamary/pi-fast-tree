name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:host
      - run: PI1_HOST_PACKAGE="$PWD/node_modules/@earendil-works/pi-coding-agent" PI1_HOST_ENTRY=bundle bun run test:host
